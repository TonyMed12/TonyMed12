ercel</text><text x="308" y="247" font-size="9" fill="#6b7894" text-anchor="start" font-weight="600"  letter-spacing="1.6">LIVE</text><text x="28" y="276" font-size="10" fill="#7ab8f0" text-anchor="start" font-weight="600" ># HTML</text><text x="83" y="276" font-size="10" fill="#7ab8f0" text-anchor="start" font-weight="600" ># Vercel</text><text x="454" y="276" font-size="10" fill="#6b7894" text-anchor="end" font-weight="400" >aquamarine-resort.vercel.app ↗</text></g><circle class="sn" cx="296" cy="0" r="1.0" fill="#ffffff" opacity="0.81" style="--h:292px;animation-duration:13.6s;animation-delay:-14.3s"/><circle class="sn" cx="202" cy="0" r="3.0" fill="#ffffff" opacity="0.81" style="--h:292px;animation-duration:8.9s;animation-delay:-13.1s"/><circle class="sn" cx="352" cy="0" r="2.2" fill="#ffffff" opacity="0.47" style="--h:292px;animation-duration:12.6s;animation-delay:-5.4s"/><circle class="sn" cx="79" cy="0" r="1.0" fill="#ffffff" opacity="0.79" style="--h:292px;animation-duration:10.1s;animation-delay:-5.1s"/><circle class="sn" cx="211" cy="0" r="1.5" fill="#ffffff" opacity="0.62" style="--h:292px;animation-duration:9.7s;animation-delay:-7.2s"/><circle class="sn" cx="121" cy="0" r="1.5" fill="#ffffff" opacity="0.72" style="--h:292px;animation-duration:8.8s;animation-delay:-5.6s"/></svg>