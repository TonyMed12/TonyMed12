t="400" >Participant, judge and admin dashboards in Next.js</text><line x1="28" x2="452" y1="270" y2="270" stroke="#ffffff" stroke-opacity=".11"/><text x="28" y="304" font-size="22" fill="#f4f6fb" text-anchor="start" font-weight="700" class="sf ">52</text><text x="28" y="321" font-size="9" fill="#6b7894" text-anchor="start" font-weight="600"  letter-spacing="1.6">COMMITS</text><text x="168" y="304" font-size="22" fill="#f4f6fb" text-anchor="start" font-weight="700" class="sf ">4</text><text x="168" y="321" font-size="9" fill="#6b7894" text-anchor="start" font-weight="600"  letter-spacing="1.6">PEOPLE</text><text x="308" y="304" font-size="15" fill="#7ab8f0" text-anchor="start" font-weight="700" class="sf ">TS + Java</text><text x="308" y="321" font-size="9" fill="#6b7894" text-anchor="start" font-weight="600"  letter-spacing="1.6">STACK</text><text x="28" y="350" font-size="10" fill="#7ab8f0" text-anchor="start" font-weight="600" ># TypeScript</text><text x="120" y="350" font-size="10" fill="#7ab8f0" text-anchor="start" font-weight="600" ># Java</text><text x="175" y="350" font-size="10" fill="#7ab8f0" text-anchor="start" font-weight="600" ># Supabase</text><text x="454" y="350" font-size="10" fill="#6b7894" text-anchor="end" font-weight="400" >github.com/TonyMed12/ProjeXus ↗</text></g><circle class="sn" cx="100" cy="0" r="1.0" fill="#ffffff" opacity="0.44" style="--h:366px;animation-duration:13.4s;animation-delay:-10.3s"/><circle class="sn" cx="54" cy="0" r="2.2" fill="#ffffff" opacity="0.84" style="--h:366px;animation-duration:8.8s;animation-delay:-5.4s"/><circle class="sn" cx="167" cy="0" r="1.0" fill="#ffffff" opacity="0.46" style="--h:366px;animation-duration:14.9s;animation-delay:-1.8s"/><circle class="sn" cx="32" cy="0" r="1.5" fill="#ffffff" opacity="0.65" style="--h:366px;animation-duration:10.1s;animation-delay:-12.6s"/><circle class="sn" cx="294" cy="0" r="3.0" fill="#ffffff" opacity="0.47" style="--h:366px;animation-duration:9.1s;animation-delay:-10.8s"/