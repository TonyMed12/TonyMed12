 font-weight="700" class="sf ">Vercel</text><text x="308" y="247" font-size="9" fill="#6b7894" text-anchor="start" font-weight="600"  letter-spacing="1.6">LIVE</text><text x="28" y="276" font-size="10" fill="#7ab8f0" text-anchor="start" font-weight="600" ># Next.js</text><text x="101" y="276" font-size="10" fill="#7ab8f0" text-anchor="start" font-weight="600" ># TypeScript</text><text x="193" y="276" font-size="10" fill="#7ab8f0" text-anchor="start" font-weight="600" ># Docker</text><text x="454" y="276" font-size="10" fill="#6b7894" text-anchor="end" font-weight="400" >caamorelia.vercel.app ↗</text></g><circle class="sn" cx="151" cy="0" r="1.5" fill="#ffffff" opacity="0.45" style="--h:292px;animation-duration:10.6s;animation-delay:-14.6s"/><circle class="sn" cx="124" cy="0" r="1.0" fill="#ffffff" opacity="0.50" style="--h:292px;animation-duration:13.3s;animation-delay:-2.6s"/><circle class="sn" cx="55" cy="0" r="1.0" fill="#ffffff" opacity="0.66" style="--h:292px;animation-duration:11.2s;animation-delay:-3.0s"/><circle class="sn" cx="423" cy="0" r="1.0" fill="#ffffff" opacity="0.71" style="--h:292px;animation-duration:11.0s;animation-delay:-13.4s"/><circle class="sn" cx="456" cy="0" r="2.2" fill="#ffffff" opacity="0.69" style="--h:292px;animation-duration:8.3s;animation-delay:-8.4s"/><circle class="sn" cx="205" cy="0" r="1.5" fill="#ffffff" opacity="0.80" style="--h:292px;animation-duration:13.4s;animation-delay:-9.0s"/></svg>