<svg xmlns="http://www.w3.org/2000/svg" width="985" height="550" viewBox="0 0 985 550" role="img" aria-label="About me: education, languages, current focus and toolbox"><title>About me: education, languages, current focus and toolbox</title><style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.sf{font-family:Georgia,'Times New Roman',serif}
.up{opacity:0;animation:up .7s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fd{opacity:0;animation:fd 1.2s ease-out .1s forwards}
@keyframes fd{to{opacity:1}}
.tw{animation:tw 3s ease-in-out infinite}
